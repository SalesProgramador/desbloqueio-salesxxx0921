<!DOCTYPE html>
<html lang="pt-BR" manifest="cache.appcache">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DESBLOQUEIO SALESSS0921 O MELHOR!</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#050507;color:#e0e0e0;
font-family:'Segoe UI',system-ui,sans-serif;user-select:none;-webkit-user-select:none}
#crt::before{content:"";position:fixed;inset:0;z-index:9999;pointer-events:none;
background:repeating-linear-gradient(0deg,rgba(0,0,0,.12) 0,rgba(0,0,0,.12) 1px,transparent 1px,transparent 3px)}
#crt::after{content:"";position:fixed;inset:0;z-index:10000;pointer-events:none;
background:radial-gradient(ellipse at center,transparent 60%,rgba(0,0,0,.45) 100%)}
#wrap{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px}
#brand{position:absolute;top:0;left:0;right:0;padding:22px 40px;display:flex;
align-items:center;justify-content:center;gap:14px;border-bottom:2px solid #ff7700;
box-shadow:0 0 30px rgba(255,119,0,.25);background:#050507}
#brand b{font-size:16px;font-weight:700;letter-spacing:2px;color:#ff7700;
text-shadow:0 0 10px #ff7700,0 0 30px #ff4400;animation:np 2.4s ease-in-out infinite}
#state{font-size:22px;font-weight:700;color:#ff7700;text-shadow:0 0 10px #ff7700;
margin-bottom:12px;text-align:center;letter-spacing:1px}
#det{font-size:13px;color:#8b95a3;margin-bottom:6px;text-align:center}
#det b{color:#c8ced8;font-weight:600}
#spin{width:46px;height:46px;border:4px solid #1e2732;border-top-color:#ff7700;
border-radius:50%;animation:spin .9s linear infinite;margin-top:10px}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes np{0%,100%{opacity:1}50%{opacity:.75}}
#msg{display:none;font-size:16px;letter-spacing:2px;font-weight:700;text-align:center;margin-top:16px}
body.done #spin{display:none}body.done #msg{display:block;color:#7fd0a0}
body.fail #spin{display:none}body.fail #msg{display:block;color:#d08a7f}
</style>
</head>
<body>
<div id="crt"></div>
<div id="brand"><b>DESBLOQUEIO SALESSS0921 O MELHOR!</b></div>
<div id="wrap">
<div id="state">detecting firmware...</div>
<div id="det"></div>
<div id="spin"></div>
<div id="msg"></div>
</div>
<script>
(function(){
var stateEl=document.getElementById("state");
var detEl=document.getElementById("det");
function setState(t,c){stateEl.textContent=t;stateEl.className=c||""}
var SUPPORTED={1302:1,1304:1,1350:1,1352:1};
var key=null,fwnum=null;
var m=/PlayStation\s+4[\/ ](\d+)\.(\d+)/.exec(navigator.userAgent);
if(m){var ms=parseInt(m[2],16).toString(16);if(ms.length<2)ms="0"+ms;
key=m[1]+"."+ms;fwnum=parseInt(m[1],10)*100+parseInt(ms,10)}
detEl.innerHTML="firmware <b>"+(key||"unknown")+"</b>";
if(fwnum!==null&&SUPPORTED[fwnum]===1){
setState("loading jailbreak...","warn");
location.replace("jb.html");
}else{setState("UNSUPPORTED FIRMWARE","bad")}
})();
</script>
</body>
</html>
