<!DOCTYPE html>
<html lang="pt-BR" manifest="cache.appcache">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DESBLOQUEIO SALESSS0921 O MELHOR!</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{margin:0;padding:0;min-height:100%;background:#050507;color:#e0e0e0;
font:15px/1.45 "Segoe UI",system-ui,sans-serif;user-select:none;-webkit-user-select:none}
#crt::before{content:"";position:fixed;inset:0;z-index:9999;pointer-events:none;
background:repeating-linear-gradient(0deg,rgba(0,0,0,.12) 0,rgba(0,0,0,.12) 1px,transparent 1px,transparent 3px)}
#crt::after{content:"";position:fixed;inset:0;z-index:10000;pointer-events:none;
background:radial-gradient(ellipse at center,transparent 60%,rgba(0,0,0,.45) 100%)}
#brand{text-align:center;padding:14px 10px;background:#050507;border-bottom:2px solid #ff7700;
box-shadow:0 0 30px rgba(255,119,0,.25)}
#brand b{font-size:15px;font-weight:700;letter-spacing:2px;color:#ff7700;
text-shadow:0 0 10px #ff7700,0 0 30px #ff4400;animation:np 2.4s ease-in-out infinite}
#spin{position:fixed;top:calc(50% + 20px);left:50%;width:46px;height:46px;margin:-23px 0 0 -23px;
border:4px solid #1e2732;border-top-color:#ff7700;border-radius:50%;animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#msg{position:fixed;top:50%;left:0;right:0;transform:translateY(-50%);text-align:center;
font-size:18px;letter-spacing:2px;font-weight:700;display:none}
body.done #spin{display:none}body.done #msg{display:block;color:#7fd0a0}
body.fail #spin{display:none}body.fail #msg{display:block;color:#d08a7f}
@keyframes np{0%,100%{opacity:1}50%{opacity:.75}}
</style>
</head>
<body>
<div id="crt"></div>
<div id="brand"><b>DESBLOQUEIO SALESSS0921 O MELHOR!</b></div>
<div id="spin"></div>
<div id="msg"></div>
<script src="int64.js"></script>
<script src="core.js"></script>
<script src="mem.js"></script>
<script src="ps4_offsets.js"></script>
<script src="rpc_worker.js"></script>
<script src="jb.js"></script>
</body>
</html>
